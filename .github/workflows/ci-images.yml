name: Test and publish images

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tag:
    runs-on: ubuntu-latest
    outputs:
      is_release_tag: ${{ steps.validate.outputs.is_release_tag }}
    steps:
      - id: validate
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_release_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release_tag=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run system update Compose contract tests
        run: bash scripts/system-update-compose.test.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

      - name: Run Windows Agent build contract tests
        run: bash scripts/build-windows-agent.test.sh

      - name: Run Windows release contract tests
        run: bash scripts/publish-windows-release.test.sh

      - name: Run DSM image cleanup tests
        run: bash scripts/cleanup-dsm-images.test.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  publish:
    if: github.ref == 'refs/heads/main' || needs.release-tag.outputs.is_release_tag == 'true'
    needs:
      - release-tag
      - test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: backend
            image: ace-it-center-backend
          - target: web
            image: ace-it-center-web
          - target: updater
            image: ace-it-center-updater
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.ref_name }},enable=${{ needs.release-tag.outputs.is_release_tag == 'true' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  promote-stable:
    if: needs.release-tag.outputs.is_release_tag == 'true'
    needs:
      - release-tag
      - publish
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote release images to stable
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          docker buildx imagetools create \
            --tag ghcr.io/${owner}/ace-it-center-backend:stable \
            ghcr.io/${owner}/ace-it-center-backend:${GITHUB_REF_NAME}
          docker buildx imagetools create \
            --tag ghcr.io/${owner}/ace-it-center-web:stable \
            ghcr.io/${owner}/ace-it-center-web:${GITHUB_REF_NAME}
